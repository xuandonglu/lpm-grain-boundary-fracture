[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lpm-grain-boundary-fracture"
version = "0.1.0"
description = "Rotated-grain lattice particle models for cohesive fracture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.14,<2", "matplotlib>=3.7,<4"]

[project.scripts]
lpm-fracture = "lpm_fracture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

